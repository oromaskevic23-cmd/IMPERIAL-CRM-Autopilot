name: CRM-SOFFT | Real Ephemeral PostgreSQL Read-only Contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crm-bridge-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-postgres-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ephemeral-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPASSWORD: local-ephemeral-ci-only
      IMPERIAL_CRM_LOCAL_PG_CI: ISOLATED_EPHEMERAL_ONLY
    steps:
      - name: Checkout public test source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Configure Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned PostgreSQL adapter
        run: python -m pip install -r crm_bridge/requirements-postgres-ci.txt
      - name: Run aggregate-only and HANTER denial suite
        run: python -m unittest discover -s tests -p 'test_crm_bridge.py' -v
      - name: Run genuine SQL transaction and least-privilege denial
        run: python -m unittest discover -s tests -p 'postgres_bridge_integration.py' -v
