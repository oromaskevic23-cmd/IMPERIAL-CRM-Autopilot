name: CRM-SOFFT | IMPERIAL Core NCA Release Guard

on:
  push:
    branches: [main]
    paths:
      - 'crm_control/**'
      - 'tests/test_crm_release_gate.py'
      - '.github/workflows/crm-release-gate.yml'
  pull_request:
    paths:
      - 'crm_control/**'
      - 'tests/test_crm_release_gate.py'
      - '.github/workflows/crm-release-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nca-enterprise-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout without token persistence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile NCA authorization gate
        run: python -m compileall -q crm_control tests/test_crm_release_gate.py
      - name: Run enterprise fail-closed tests
        run: python -m unittest discover -s tests -p 'test_crm_release_gate.py' -v
      - name: Verify one synthetic operational posture
        run: python -m crm_control
