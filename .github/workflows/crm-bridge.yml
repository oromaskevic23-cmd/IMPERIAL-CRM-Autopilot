name: CRM-SOFFT | Private Read-only Bridge and HANTER Triage CI

on:
  push:
    branches: [main]
    paths:
      - 'crm_bridge/**'
      - 'tests/test_crm_bridge.py'
      - '.github/workflows/crm-bridge.yml'
  pull_request:
    paths:
      - 'crm_bridge/**'
      - 'tests/test_crm_bridge.py'
      - '.github/workflows/crm-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Select Python version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile read-only source
        run: python -m compileall -q crm_bridge tests/test_crm_bridge.py
      - name: Prove aggregate-only SQL and denied commercial effects
        run: python -m unittest discover -s tests -p 'test_crm_bridge.py' -v
