name: CRM-SOFFT | Deal Integrity and Federated Dispatch CI

on:
  push:
    branches: [main]
    paths:
      - 'crm_core/**'
      - 'tests/test_crm_core.py'
      - '.github/workflows/crm-core.yml'
  pull_request:
    paths:
      - 'crm_core/**'
      - 'tests/test_crm_core.py'
      - '.github/workflows/crm-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-deal-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile self-contained CRM package
        run: python -m compileall -q crm_core tests/test_crm_core.py
      - name: Run tenant isolation, idempotency, queue and money safety tests
        run: python -m unittest discover -s tests -p 'test_crm_core.py' -v
      - name: Execute reproducible end-to-end synthetic CRM pilot
        run: python -m crm_core
